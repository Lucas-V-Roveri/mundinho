name: Etapa 2 audit regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Probe production runtime config
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://mundinho-blue.vercel.app/api/config -o /tmp/mundinho-config.json
          node - <<'NODE'
          const cfg = require('/tmp/mundinho-config.json');
          if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.supabaseUrl || '')) throw new Error('SUPABASE_URL inválida em produção');
          if (!/^sb_publishable_/.test(cfg.supabasePublishableKey || '') && String(cfg.supabasePublishableKey || '').split('.').length !== 3) throw new Error('SUPABASE_PUBLISHABLE_KEY inválida em produção');
          if (cfg.worldId !== 'mundinho-pra-sempre') throw new Error('worldId inesperado');
          console.log('PRODUCTION_CONFIG_RESPONSE=' + JSON.stringify(cfg));
          NODE

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Start local production build with production public config
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="$(node -e "const c=require('/tmp/mundinho-config.json'); process.stdout.write(c.supabaseUrl)")"
          export SUPABASE_PUBLISHABLE_KEY="$(node -e "const c=require('/tmp/mundinho-config.json'); process.stdout.write(c.supabasePublishableKey)")"
          npm run start -- -p 3000 >/tmp/mundinho-next.log 2>&1 &
          echo $! >/tmp/mundinho-next.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/config >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mundinho-next.log
          exit 1

      - name: Validate static totals in raw SSR HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/ -o /tmp/home.html
          curl -fsS http://127.0.0.1:3000/progressao -o /tmp/progressao.html
          curl -fsS http://127.0.0.1:3000/mods -o /tmp/mods.html
          curl -fsS http://127.0.0.1:3000/extras -o /tmp/extras.html
          node - <<'NODE'
          const fs = require('fs');
          const text = file => fs.readFileSync(file, 'utf8').replace(/<!--.*?-->/gs, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
          const home = text('/tmp/home.html');
          const progression = text('/tmp/progressao.html');
          const mods = text('/tmp/mods.html');
          const extras = text('/tmp/extras.html');
          if (!/Guias\s+35/.test(home)) throw new Error('Home SSR não contém Guias 35');
          if (!/Marcos\s+101/.test(home)) throw new Error('Home SSR não contém Marcos 101');
          if (!/Ideias extras\s+18/.test(home)) throw new Error('Home SSR não contém Extras 18');
          if (!progression.includes('101 marcos do mundinho')) throw new Error('Progressão SSR não contém 101 marcos');
          if (!mods.includes('35 guia(s) no Mundinho')) throw new Error('Mods SSR não contém 35 guias');
          if (!extras.includes('18 ideias')) throw new Error('Extras SSR não contém 18 ideias');
          if (/XP do mundinho\s+0\/0/.test(home)) throw new Error('Home SSR vazou XP 0/0');
          console.log('SSR_TOTALS_OK');
          NODE

      - name: Validate P1-P3 in browser
        shell: bash
        run: |
          mkdir -p artifacts/audit
          cat >/tmp/audit.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const base = 'http://127.0.0.1:3000';
          const prodConfig = JSON.parse(fs.readFileSync('/tmp/mundinho-config.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForReady(page) {
            await page.getByText('Supabase compartilhado', { exact: true }).first().waitFor({ timeout: 30000 });
            const loader = page.getByRole('status', { name: 'Carregando o mundinho' });
            if (await loader.count()) await loader.waitFor({ state: 'detached', timeout: 30000 });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            // P2: totals remain present with JS completely disabled.
            const noJs = await browser.newContext({ javaScriptEnabled: false, viewport: { width: 1200, height: 900 } });
            for (const [path, expected] of [
              ['/', ['Guias', '35', 'Marcos', '101', 'Ideias extras', '18']],
              ['/progressao', ['101 marcos do mundinho']],
              ['/mods', ['35 guia(s) no Mundinho']],
              ['/extras', ['18 ideias']],
            ]) {
              const page = await noJs.newPage();
              await page.goto(base + path, { waitUntil: 'domcontentloaded' });
              const text = await page.locator('body').innerText();
              for (const value of expected) assert(text.includes(value), `${path} sem JS não contém ${value}`);
              assert(!text.includes('Carregando chunks...'), `${path} sem JS ficou coberto pelo chunk loader`);
              await page.close();
            }
            await noJs.close();

            // P1 + P3: delayed config simulates a slow startup. No local fallback, zeros or completion lie.
            const slow = await browser.newContext({ viewport: { width: 1200, height: 900 } });
            const slowPage = await slow.newPage();
            await slowPage.route('**/api/config', async route => { await sleep(2800); await route.continue(); });
            await slowPage.goto(base + '/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await slowPage.waitForTimeout(500);
            const slowText = await slowPage.locator('body').innerText();
            assert(slowText.includes('conectando...'), 'Loading não mostra conectando...');
            assert(slowText.includes('acendendo as tochas...'), 'Loading não mostra acendendo as tochas...');
            assert(!slowText.includes('Prévia local'), 'Prévia local apareceu antes de /api/config responder');
            assert(!slowText.includes('Tudo elegível já foi marcado'), 'Tudo marcado apareceu durante loading');
            assert(!/XP do mundinho\s*0\/0/.test(slowText), 'XP 0/0 apareceu durante loading');
            await waitForReady(slowPage);
            await slow.close();

            // P1: configured Supabase + network failure must be explicit red error, never local.
            const failed = await browser.newContext({ viewport: { width: 1200, height: 900 } });
            const failedPage = await failed.newPage();
            await failedPage.route('**/api/config', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(prodConfig) }));
            await failedPage.route(/https:\/\/ldsdkyvuguguookjynoj\.supabase\.co\/.*/, route => route.abort('failed'));
            await failedPage.goto(base + '/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await failedPage.getByText('falha de conexão — tentar novamente', { exact: true }).first().waitFor({ timeout: 20000 });
            const failedText = await failedPage.locator('body').innerText();
            assert(!failedText.includes('Prévia local'), 'Falha de Supabase virou Prévia local');
            assert(!failedText.includes('Tudo elegível já foi marcado'), 'Erro foi interpretado como tudo concluído');
            assert(!/XP do mundinho\s*0\/0/.test(failedText), 'Erro exibiu XP falso 0/0');
            await failed.close();

            // P1: preview-local is allowed only when config explicitly returns no Supabase config.
            const local = await browser.newContext({ viewport: { width: 1200, height: 900 } });
            const localPage = await local.newPage();
            await localPage.route('**/api/config', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ supabaseUrl: '', supabasePublishableKey: '', worldId: 'mundinho-pra-sempre' }) }));
            await localPage.goto(base + '/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await localPage.getByText('Prévia local', { exact: true }).first().waitFor({ timeout: 10000 });
            const localText = await localPage.locator('body').innerText();
            assert(!localText.includes('Tudo elegível já foi marcado'), 'Prévia local sem conteúdo mentiu que tudo foi concluído');
            assert(localText.includes('conteúdo compartilhado da wiki não pôde ser carregado'), 'Prévia local não explica que o conteúdo compartilhado está indisponível');
            await local.close();

            // Healthy configured state.
            const healthy = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await healthy.newPage();
            await page.goto(base + '/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitForReady(page);
            const home = await page.locator('body').innerText();
            assert(home.includes('Guias\n35'), 'Home pronta não mostra 35 guias');
            assert(home.includes('Marcos\n101'), 'Home pronta não mostra 101 marcos');
            assert(home.includes('Ideias extras\n18'), 'Home pronta não mostra 18 extras');
            assert(!home.includes('Prévia local'), 'Estado saudável ainda mostra Prévia local');
            assert(!/XP do mundinho\s*0\/0/.test(home), 'Home saudável mostra XP 0/0');
            await page.screenshot({ path: 'artifacts/audit/home-ready.png', fullPage: true });

            await page.goto(base + '/mods', { waitUntil: 'domcontentloaded' });
            await waitForReady(page);
            await page.getByText('35 guia(s) nesta seleção', { exact: true }).waitFor({ timeout: 30000 });
            assert(await page.locator('article[id^="guide-"]').count() === 35, 'Mods não carregou 35 guias');

            await page.goto(base + '/progressao', { waitUntil: 'domcontentloaded' });
            await waitForReady(page);
            assert((await page.getByRole('heading', { name: 'Progressão', level: 1 }).count()) === 1, 'Progressão não carregou corretamente');

            fs.writeFileSync('artifacts/audit/evidence.txt', [
              `production-config=${JSON.stringify(prodConfig)}`,
              'P1-loading=connecting-only',
              'P1-configured-failure=explicit-error',
              'P1-config-absent=explicit-preview-local',
              'P1-healthy=Supabase-compartilhado',
              'P2-raw-SSR=35-guides,101-progression,18-extras',
              'P2-js-disabled=totals-visible',
              'P3-loading=no-all-done',
              'P3-error=no-all-done',
            ].join('\n'));

            await healthy.close();
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node /tmp/audit.cjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mundinho-next.log || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa2-p1-p3-audit
          path: artifacts/audit
          if-no-files-found: warn
