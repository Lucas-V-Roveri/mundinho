name: Production browser smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Vercel Git deployment
        run: sleep 35
      - name: Check HTTP endpoints and Supabase config
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/home.headers https://mundinho-blue.vercel.app/ -o /tmp/home.html
          curl -fsS -D /tmp/config.headers https://mundinho-blue.vercel.app/api/config -o /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if (!cfg.supabaseUrl) throw new Error('SUPABASE_URL ausente em /api/config');
          if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.supabaseUrl)) throw new Error('SUPABASE_URL inválida ou variáveis invertidas');
          if (!cfg.supabaseAnonKey) throw new Error('SUPABASE_PUBLISHABLE_KEY ausente em /api/config');
          if (!/^sb_publishable_/.test(cfg.supabaseAnonKey) && cfg.supabaseAnonKey.split('.').length !== 3) throw new Error('SUPABASE_PUBLISHABLE_KEY inválida');
          if (cfg.worldId !== 'mundinho-pra-sempre') throw new Error('worldId inesperado');
          console.log('Config OK:', {supabaseUrl: cfg.supabaseUrl, worldId: cfg.worldId, keyPresent: true});
          NODE
      - name: Browser smoke test
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('console',m=>{ console.log('BROWSER-CONSOLE',m.type(),m.text()); if(m.type()==='error') errors.push(m.text()); });
            page.on('pageerror',e=>{ console.log('PAGE-ERROR',e.stack||e.message); errors.push(e.message); });
            page.on('requestfailed',r=>{ console.log('REQUEST-FAILED',r.url(),r.failure()?.errorText); errors.push(`${r.url()} ${r.failure()?.errorText||''}`); });
            const response=await page.goto('https://mundinho-blue.vercel.app/',{waitUntil:'networkidle',timeout:30000});
            if (response?.status() !== 200) throw new Error(`HTTP ${response?.status()}`);
            await page.waitForTimeout(1500);
            const body=await page.locator('body').innerText();
            const loaderVisible=await page.locator('#chunk-loader').isVisible();
            const shellVisible=await page.locator('#site-shell').isVisible();
            console.log('LOADER_VISIBLE',loaderVisible);
            console.log('SHELL_VISIBLE',shellVisible);
            console.log('BODY',body.slice(0,1200).replace(/\n/g,' | '));
            if (loaderVisible) throw new Error('Chunk loader continua visível depois da inicialização');
            if (!shellVisible) throw new Error('Site shell não ficou visível depois da inicialização');
            if (body.includes('Prévia local.')) throw new Error('Site ainda está em prévia local; Supabase não foi ativado');
            if (!body.includes('sincronização: Supabase compartilhado')) throw new Error('Indicador de Supabase compartilhado não apareceu');
            if (errors.length) throw new Error(`Erros no navegador: ${errors.join(' || ')}`);
            await browser.close();
          })().catch(e=>{console.error('SMOKE-FATAL',e);process.exit(1)});
          NODE
          node /tmp/smoke.cjs
