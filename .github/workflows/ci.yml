name: CI

on:
  push:
    branches: [main, next-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Bestiary media guard
        run: npm run test:bestiary-media
      - name: Bestiary audit and canary preservation
        run: npm run test:bestiary-audit
      - name: Minecraft progress sync
        run: npm run test:minecraft-progress
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
